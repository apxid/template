<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kosmo Login</title>
<style>
/* =========================================================
   RESET & BASE STYLES
========================================================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: #121212;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
}

/* =========================================================
   MOBILE CARD CONTAINER
========================================================= */
.app-container {
    width: 100%;
    max-width: 380px;
    height: 720px;
    background-color: #0b44ee;
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
}

/* STATUS BAR MOCKUP */
.status-bar {
    height: 40px;
    background-color: #f3f3f7;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    font-size: 13px;
    font-weight: 600;
    color: #000;
    z-index: 10;
}

.notch {
    width: 90px;
    height: 22px;
    background-color: #000;
    border-radius: 12px;
}

/* =========================================================
   TOP SECTION (WHITE)
========================================================= */
.top-section {
    background-color: #f3f3f7;
    padding-top: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
}

.logo-container {
    width: 100px;
    height: 100px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 26px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(11, 68, 238, 0.15);
}

.logo-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.app-title {
    color: #1b2559;
    font-size: 22px;
    font-weight: 800;
    margin-top: 12px;
    letter-spacing: 0.3px;
}

/* WAVE SVG SEPARATION */
.wave-container {
    width: 100%;
    line-height: 0;
    background-color: #f3f3f7;
}

.wave-container svg {
    width: 100%;
    height: 60px;
}

/* =========================================================
   BOTTOM SECTION (BLUE FORM)
========================================================= */
.form-section {
    background-color: #0b44ee;
    flex: 1;
    padding: 10px 32px 30px 32px;
    display: flex;
    flex-direction: column;
}

.login-header h1 {
    font-size: 28px;
    font-weight: 800;
    color: #ffffff;
    margin-bottom: 6px;
}

.login-header p {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.7);
    line-height: 1.4;
    margin-bottom: 25px;
}

/* INPUT GROUPS */
.input-group {
    position: relative;
    margin-bottom: 14px;
}

.input-box {
    width: 100%;
    height: 52px;
    background-color: #0a3cd4;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 0 50px 0 18px;
    color: #ffffff;
    font-size: 13px;
    outline: none;
    transition: all 0.2s ease;
}

.input-box::placeholder {
    color: rgba(255, 255, 255, 0.5);
}

.input-box:focus {
    border-color: rgba(255, 255, 255, 0.4);
    background-color: #0834bc;
}

.input-icon-btn {
    position: absolute;
    right: 8px;
    top: 6px;
    width: 40px;
    height: 40px;
    background: transparent;
    border: none;
    color: rgba(255, 255, 255, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

/* REMEMBER ME CHECKBOX */
.options-row {
    display: flex;
    align-items: center;
    margin: 10px 0 24px 0;
}

.remember-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.9);
    cursor: pointer;
    user-select: none;
}

.remember-label input {
    display: none;
}

.custom-checkbox {
    width: 20px;
    height: 20px;
    background-color: #ccff00;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.custom-checkbox::after {
    content: "✓";
    color: #000;
    font-size: 13px;
    font-weight: 900;
}

.remember-label input:not(:checked) + .custom-checkbox {
    background-color: rgba(255, 255, 255, 0.2);
}

.remember-label input:not(:checked) + .custom-checkbox::after {
    display: none;
}

/* LOGIN BUTTON */
.btn-login {
    width: 100%;
    height: 52px;
    background-color: #ccff00;
    border: none;
    border-radius: 16px;
    color: #000000;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s ease, background-color 0.2s ease;
}

.btn-login:active {
    transform: scale(0.98);
    background-color: #b5e600;
}

/* POPUP MODAL */
.popup-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 20;
    padding: 20px;
}

.popup-overlay.active {
    opacity: 1;
    pointer-events: auto;
}

.popup-card {
    background: #ffffff;
    border-radius: 20px;
    padding: 24px;
    text-align: center;
    color: #333;
    width: 100%;
}

.popup-card h3 {
    margin-bottom: 8px;
    color: #0b44ee;
}

.popup-card p {
    font-size: 13px;
    color: #666;
    margin-bottom: 16px;
}

.popup-card button {
    background: #0b44ee;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="app-container">
    <!-- STATUS BAR -->
    <div class="status-bar">
        <span>4:33</span>
        <div class="notch"></div>
        <div style="display:flex; gap: 4px; align-items: center;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 21l3.64-.62C9.53 20.74 10.73 21 12 21c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/></svg>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17 7H7c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2z"/></svg>
        </div>
    </div>

    <!-- TOP SECTION (LOGO & TITLE) -->
    <div class="top-section">
        <div class="logo-container">
            <img src="https://yanuar-moga.github.io/assets/logo.jpg" alt="Logo Kosmo">
        </div>
        <div class="app-title">Kosmo</div>
    </div>

    <!-- TRANSITION WAVE -->
    <div class="wave-container">
        <svg viewBox="0 0 500 150" preserveAspectRatio="none">
            <path d="M0,30 C150,90 350,-30 500,40 L500,150 L0,150 Z" fill="#0b44ee"></path>
        </svg>
    </div>

    <!-- BOTTOM FORM SECTION -->
    <div class="form-section">
        <div class="login-header">
            <h1>Login</h1>
            <p>Enter your login and password<br>to sign in to the app</p>
        </div>

        <form id="loginForm">
            <!-- EMAIL / USERNAME -->
            <div class="input-group">
                <input type="text" id="email" class="input-box" placeholder="Enter your email" required>
                <button type="button" class="input-icon-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </button>
            </div>

            <!-- PASSWORD -->
            <div class="input-group">
                <input type="password" id="password" class="input-box" placeholder="Enter your password" required>
                <button type="button" class="input-icon-btn" id="togglePassword">
                    <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>

            <!-- REMEMBER ME -->
            <div class="options-row">
                <label class="remember-label">
                    <input type="checkbox" id="rememberMe" checked>
                    <span class="custom-checkbox"></span>
                    <span>Remember me</span>
                </label>
            </div>

            <!-- SUBMIT BUTTON -->
            <button type="submit" class="btn-login">Login</button>
        </form>
    </div>

    <!-- POPUP MODAL -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-card">
            <h3 id="popupTitle">Berhasil</h3>
            <p id="popupMessage">Anda telah berhasil login.</p>
            <button id="closePopup">Tutup</button>
        </div>
    </div>
</div>

<script>
const togglePassword = document.getElementById('togglePassword');
const passwordInput = document.getElementById('password');
const loginForm = document.getElementById('loginForm');
const popupOverlay = document.getElementById('popupOverlay');
const popupTitle = document.getElementById('popupTitle');
const popupMessage = document.getElementById('popupMessage');
const closePopup = document.getElementById('closePopup');

// Toggle Password Visibility
togglePassword.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
});

// Form Submit Handler
loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = passwordInput.value.trim();

    if(email && password) {
        popupTitle.innerText = "Login Berhasil";
        popupMessage.innerText = `Selamat datang kembali, ${email}!`;
        popupOverlay.classList.add('active');
    }
});

closePopup.addEventListener('click', () => {
    popupOverlay.classList.remove('active');
});
</script>

</body>
</html>
