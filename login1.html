<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MB Login</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow-x: hidden;

    color: #333;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(255,255,255,.55),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 85%,
            rgba(255,255,255,.35),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #c7e4df 0%,
            #dff0ec 50%,
            #b8d9d4 100%
        );
}


/* =========================================================
   ANIMATED BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 0;
}

.bg-circle {
    position: absolute;

    border-radius: 50%;

    opacity: .35;

    filter: blur(2px);

    animation:
        floating 8s ease-in-out infinite;
}

.bg-circle:nth-child(1) {
    width: 180px;
    height: 180px;

    background: #ffffff;

    top: 5%;
    left: 5%;
}

.bg-circle:nth-child(2) {
    width: 260px;
    height: 260px;

    background: #f19b80;

    top: 5%;
    right: -80px;

    animation-delay: 2s;
}

.bg-circle:nth-child(3) {
    width: 150px;
    height: 150px;

    background: #ffffff;

    bottom: 5%;
    left: -50px;

    animation-delay: 4s;
}

.bg-circle:nth-child(4) {
    width: 220px;
    height: 220px;

    background: #ed8569;

    bottom: -90px;
    right: 10%;

    animation-delay: 1s;
}

@keyframes floating {

    0%,
    100% {
        transform:
            translate3d(0, 0, 0)
            scale(1);
    }

    50% {
        transform:
            translate3d(20px, -25px, 0)
            scale(1.05);
    }
}


/* =========================================================
   MAIN
========================================================= */

.login-wrapper {
    position: relative;

    z-index: 5;

    width: min(430px, 92vw);

    padding: 18px;
}


/* =========================================================
   LOGIN CARD
========================================================= */

.login-card {
    position: relative;

    width: 100%;

    min-height: 620px;

    overflow: hidden;

    background: #f8f7ef;

    border-radius: 38px;

    box-shadow:
        0 35px 80px rgba(45, 85, 82, .24),
        0 10px 25px rgba(0,0,0,.08);

    animation:
        cardAppear
        .8s
        cubic-bezier(.2,.8,.2,1)
        both;
}

@keyframes cardAppear {

    from {
        opacity: 0;
        transform:
            translateY(45px)
            scale(.94);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   HEADER
========================================================= */

.header {
    position: relative;

    height: 285px;

    padding:
        38px
        36px;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            #ed785a 0%,
            #e98264 50%,
            #f19a7b 100%
        );
}


/* =========================================================
   HEADER WAVE
========================================================= */

.header::after {
    content: "";

    position: absolute;

    left: -12%;

    bottom: -105px;

    width: 125%;

    height: 190px;

    background: #f8f7ef;

    border-radius:
        50%
        50%
        0
        0 /
        65%
        65%
        0
        0;

    transform: rotate(-2deg);
}


/* =========================================================
   LOGO
========================================================= */

.logo-container {
    position: relative;

    z-index: 5;

    width: 58px;
    height: 58px;

    border-radius: 17px;

    overflow: hidden;

    background: rgba(255,255,255,.25);

    border:
        1px solid
        rgba(255,255,255,.45);

    box-shadow:
        0 8px 20px rgba(0,0,0,.10);

    backdrop-filter: blur(10px);

    animation:
        logoFloat
        3.5s
        ease-in-out
        infinite;
}

.logo-container img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

@keyframes logoFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-6px);
    }
}


/* =========================================================
   TITLE
========================================================= */

.title {
    position: relative;

    z-index: 5;

    margin-top: 23px;

    color: white;

    animation:
        titleAppear
        .8s
        .15s
        both;
}

@keyframes titleAppear {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.title h1 {
    font-size: 32px;

    font-weight: 700;

    letter-spacing: -.8px;
}

.title p {
    margin-top: 6px;

    font-size: 14px;

    line-height: 1.5;

    opacity: .88;
}


/* =========================================================
   FORM AREA
========================================================= */

.form-area {
    position: relative;

    z-index: 10;

    padding:
        0
        36px
        35px;

    margin-top: -10px;

    animation:
        formAppear
        .9s
        .25s
        both;
}

@keyframes formAppear {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   INPUT GROUP
========================================================= */

.input-group {
    margin-bottom: 20px;
}

.input-label {
    display: block;

    margin-bottom: 8px;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 1.3px;

    color: #aaa79d;
}


/* =========================================================
   INPUT
========================================================= */

.input-box {
    position: relative;
}

.input-box input {
    width: 100%;

    height: 55px;

    padding:
        0
        48px
        0
        47px;

    border:
        1px
        solid
        #e6e3d9;

    border-radius: 16px;

    outline: none;

    background:
        rgba(255,255,255,.82);

    color: #444;

    font-size: 14px;

    transition:
        border-color .25s,
        box-shadow .25s,
        transform .25s,
        background .25s;
}

.input-box input::placeholder {
    color: #bdbbb4;
}

.input-box input:focus {
    border-color: #e78062;

    background: #fff;

    box-shadow:
        0 0 0 4px
        rgba(231,128,98,.12);

    transform:
        translateY(-1px);
}


/* =========================================================
   INPUT ICON
========================================================= */

.input-icon {
    position: absolute;

    left: 16px;
    top: 50%;

    transform:
        translateY(-50%);

    color: #c3c1b9;

    pointer-events: none;

    transition:
        color .25s;
}

.input-box:focus-within
.input-icon {
    color: #e77d60;
}


/* =========================================================
   PASSWORD TOGGLE
========================================================= */

.password-toggle {
    position: absolute;

    right: 14px;
    top: 50%;

    transform:
        translateY(-50%);

    width: 32px;
    height: 32px;

    border: none;

    background: transparent;

    color: #aaa;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 10px;

    transition:
        color .2s,
        background .2s;
}

.password-toggle:hover {
    color: #e77c5e;

    background:
        rgba(231,124,94,.08);
}


/* =========================================================
   FORGOT PASSWORD
========================================================= */

.form-options {
    display: flex;

    justify-content: flex-end;

    margin-top: -8px;

    margin-bottom: 20px;
}

.forgot {
    font-size: 12px;

    color: #e47c60;

    cursor: pointer;

    transition:
        opacity .2s;
}

.forgot:hover {
    opacity: .65;
}


/* =========================================================
   LOGIN BUTTON
========================================================= */

.login-btn {
    position: relative;

    width: 100%;

    height: 56px;

    border: none;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #e87557,
            #dd694e
        );

    color: white;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    overflow: hidden;

    box-shadow:
        0 10px 22px
        rgba(222,105,78,.25);

    transition:
        transform .2s,
        box-shadow .2s,
        opacity .2s;
}

.login-btn::before {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 70%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.22),
            transparent
        );

    transform: skewX(-20deg);

    transition:
        left .7s;
}

.login-btn:hover::before {
    left: 140%;
}

.login-btn:hover {
    transform:
        translateY(-2px);

    box-shadow:
        0 14px 28px
        rgba(222,105,78,.32);
}

.login-btn:active {
    transform:
        scale(.97);
}

.login-btn.loading {
    pointer-events: none;

    opacity: .85;
}


/* =========================================================
   BUTTON LOADER
========================================================= */

.loader {
    display: inline-block;

    width: 20px;
    height: 20px;

    border:
        3px
        solid
        rgba(255,255,255,.4);

    border-top-color: white;

    border-radius: 50%;

    animation:
        spin
        .7s
        linear
        infinite;

    vertical-align: middle;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   POPUP OVERLAY
========================================================= */

.popup-overlay {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(20,35,34,.46);

    backdrop-filter:
        blur(8px);

    opacity: 0;

    visibility: hidden;

    transition:
        opacity .3s,
        visibility .3s;
}

.popup-overlay.active {
    opacity: 1;

    visibility: visible;
}


/* =========================================================
   POPUP
========================================================= */

.popup {
    width:
        min(
            370px,
            90vw
        );

    padding:
        35px
        28px;

    border-radius: 30px;

    background: #fffdf7;

    text-align: center;

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.25);

    transform:
        translateY(35px)
        scale(.88);

    transition:
        transform
        .45s
        cubic-bezier(.2,.8,.2,1);
}

.popup-overlay.active .popup {
    transform:
        translateY(0)
        scale(1);
}


/* =========================================================
   POPUP ICON
========================================================= */

.popup-icon {
    width: 76px;
    height: 76px;

    margin: 0 auto;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    animation:
        popupIcon
        .55s
        .1s
        both;
}

.popup.success
.popup-icon {
    background: #e2f5e9;

    color: #3baa69;
}

.popup.error
.popup-icon {
    background: #fde6e1;

    color: #e5684d;
}

@keyframes popupIcon {

    from {
        opacity: 0;

        transform:
            scale(.2)
            rotate(-25deg);
    }

    to {
        opacity: 1;

        transform:
            scale(1)
            rotate(0);
    }
}


/* =========================================================
   CHECKMARK
========================================================= */

.checkmark {
    width: 27px;
    height: 15px;

    border-left:
        4px
        solid
        currentColor;

    border-bottom:
        4px
        solid
        currentColor;

    transform:
        rotate(-45deg)
        scale(0);

    animation:
        checkmark
        .45s
        .3s
        forwards;
}

@keyframes checkmark {

    to {
        transform:
            rotate(-45deg)
            scale(1);
    }
}


/* =========================================================
   POPUP TEXT
========================================================= */

.popup h2 {
    margin-top: 20px;

    font-size: 22px;

    font-weight: 700;

    color: #333;
}

.popup p {
    margin-top: 9px;

    font-size: 13px;

    line-height: 1.6;

    color: #999;
}


/* =========================================================
   POPUP BUTTON
========================================================= */

.popup-close {
    width: 100%;

    height: 49px;

    margin-top: 24px;

    border: none;

    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            #e8795b,
            #dd694e
        );

    color: white;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform .2s,
        box-shadow .2s;
}

.popup-close:hover {
    transform:
        translateY(-2px);

    box-shadow:
        0 8px 20px
        rgba(221,105,78,.25);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 500px) {

    body {
        min-height: 100svh;
    }

    .login-wrapper {
        width: 100%;

        padding:
            12px;
    }

    .login-card {
        min-height: 600px;

        border-radius: 32px;
    }

    .header {
        height: 265px;

        padding:
            32px
            28px;
    }

    .header::after {
        bottom: -90px;
    }

    .logo-container {
        width: 54px;
        height: 54px;

        border-radius: 16px;
    }

    .title {
        margin-top: 20px;
    }

    .title h1 {
        font-size: 29px;
    }

    .title p {
        font-size: 13px;
    }

    .form-area {
        padding:
            0
            28px
            30px;
    }

    .input-box input {
        height: 53px;
    }

}


/* =========================================================
   SMALL PHONE
========================================================= */

@media (max-width: 360px) {

    .login-card {
        min-height: 570px;
    }

    .header {
        height: 240px;

        padding:
            28px
            25px;
    }

    .title h1 {
        font-size: 26px;
    }

    .title p {
        font-size: 12px;
    }

    .form-area {
        padding:
            0
            25px
            25px;
    }

    .input-group {
        margin-bottom: 16px;
    }

    .login-btn {
        height: 53px;
    }
}


/* =========================================================
   ACCESSIBILITY
========================================================= */

button,
input {
    font-family: inherit;
}

button:focus-visible,
input:focus-visible {
    outline:
        3px solid
        rgba(231,126,96,.25);

    outline-offset: 2px;
}

</style>
</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background">

    <div class="bg-circle"></div>

    <div class="bg-circle"></div>

    <div class="bg-circle"></div>

    <div class="bg-circle"></div>

</div>


<!-- =====================================================
     LOGIN
===================================================== -->

<main class="login-wrapper">

    <section class="login-card">


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="header">


            <!-- LOGO -->

            <div class="logo-container">

                <img
                    src="https://yanuar-moga.github.io/assets/logo.jpg"
                    alt="Logo MB"
                    onerror="this.style.display='none';"
                >

            </div>


            <!-- TITLE -->

            <div class="title">

                <h1>
                    MB Login
                </h1>

                <p>
                    Welcome back, sign in to continue
                </p>

            </div>


        </header>



        <!-- =================================================
             FORM
        ================================================== -->

        <div class="form-area">

            <form
                id="loginForm"
                autocomplete="on">


                <!-- USERNAME -->

                <div class="input-group">

                    <label
                        class="input-label"
                        for="username">

                        USERNAME

                    </label>


                    <div class="input-box">


                        <!-- USER ICON -->

                        <span
                            class="input-icon">

                            <svg
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none">

                                <circle
                                    cx="12"
                                    cy="8"
                                    r="3.5"
                                    stroke="currentColor"
                                    stroke-width="1.7"/>

                                <path
                                    d="M5 20C5.8 16.5 8.1 15 12 15C15.9 15 18.2 16.5 19 20"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"/>

                            </svg>

                        </span>


                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required>

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="input-group">

                    <label
                        class="input-label"
                        for="password">

                        PASSWORD

                    </label>


                    <div class="input-box">


                        <!-- LOCK ICON -->

                        <span
                            class="input-icon">

                            <svg
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none">

                                <rect
                                    x="5"
                                    y="10"
                                    width="14"
                                    height="10"
                                    rx="2"
                                    stroke="currentColor"
                                    stroke-width="1.7"/>

                                <path
                                    d="M8 10V7C8 4.8 9.8 3 12 3C14.2 3 16 4.8 16 7V10"
                                    stroke="currentColor"
                                    stroke-width="1.7"/>

                            </svg>

                        </span>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>


                        <!-- EYE -->

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password">


                            <svg
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none">

                                <path
                                    d="M2.5 12C4.5 7.8 8 5.5 12 5.5C16 5.5 19.5 7.8 21.5 12C19.5 16.2 16 18.5 12 18.5C8 18.5 4.5 16.2 2.5 12Z"
                                    stroke="currentColor"
                                    stroke-width="1.7"/>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                    stroke="currentColor"
                                    stroke-width="1.7"/>

                            </svg>

                        </button>


                    </div>

                </div>



                <!-- FORGOT PASSWORD -->

                <div class="form-options">

                    <span
                        class="forgot"
                        id="forgotPassword">

                        Forgot password?

                    </span>

                </div>



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton">

                    <span id="loginText">
                        Sign In
                    </span>

                </button>


            </form>

        </div>

    </section>

</main>



<!-- =====================================================
     POPUP
===================================================== -->

<div
    class="popup-overlay"
    id="popupOverlay">


    <div
        class="popup"
        id="popup">


        <!-- ICON -->

        <div
            class="popup-icon"
            id="popupIcon">

            <div class="checkmark"></div>

        </div>


        <!-- TITLE -->

        <h2 id="popupTitle">
            Login Successful
        </h2>


        <!-- MESSAGE -->

        <p id="popupMessage">
            Selamat datang kembali.
        </p>


        <!-- CLOSE -->

        <button
            type="button"
            class="popup-close"
            id="popupClose">

            Continue

        </button>


    </div>

</div>



<script>

/* =========================================================
   ELEMENT
========================================================= */

const loginForm =
    document.getElementById(
        "loginForm"
    );

const username =
    document.getElementById(
        "username"
    );

const password =
    document.getElementById(
        "password"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const loginText =
    document.getElementById(
        "loginText"
    );

const togglePassword =
    document.getElementById(
        "togglePassword"
    );

const popupOverlay =
    document.getElementById(
        "popupOverlay"
    );

const popup =
    document.getElementById(
        "popup"
    );

const popupIcon =
    document.getElementById(
        "popupIcon"
    );

const popupTitle =
    document.getElementById(
        "popupTitle"
    );

const popupMessage =
    document.getElementById(
        "popupMessage"
    );

const popupClose =
    document.getElementById(
        "popupClose"
    );


/* =========================================================
   PASSWORD TOGGLE
========================================================= */

togglePassword.addEventListener(
    "click",
    function () {

        const showing =
            password.type === "text";


        if (showing) {

            password.type =
                "password";

        } else {

            password.type =
                "text";

        }

    }
);


/* =========================================================
   LOGIN SUBMIT
========================================================= */

loginForm.addEventListener(
    "submit",
    function (event) {

        event.preventDefault();


        const user =
            username.value.trim();

        const pass =
            password.value.trim();


        /* VALIDASI */

        if (!user) {

            showPopup(
                "error",
                "Username Required",
                "Silakan masukkan username terlebih dahulu."
            );

            username.focus();

            return;
        }


        if (!pass) {

            showPopup(
                "error",
                "Password Required",
                "Silakan masukkan password terlebih dahulu."
            );

            password.focus();

            return;
        }


        /* =================================================
           LOADING
        ================================================= */

        loginButton.classList.add(
            "loading"
        );

        loginButton.disabled =
            true;

        loginText.innerHTML =
            '<span class="loader"></span>';


        /*
         * ==================================================
         * SIMULASI LOGIN
         *
         * BAGIAN INI NANTI BISA DIGANTI DENGAN:
         *
         * Google Apps Script
         * REST API
         * Firebase
         * Spreadsheet
         * Backend lainnya
         * ==================================================
         */

        setTimeout(
            function () {


                /* KEMBALIKAN BUTTON */

                loginButton.classList.remove(
                    "loading"
                );

                loginButton.disabled =
                    false;

                loginText.innerText =
                    "Sign In";


                /*
                 * CONTOH HASIL LOGIN
                 *
                 * Untuk sementara setiap
                 * username/password dianggap benar.
                 */

                showPopup(
                    "success",
                    "Login Successful",
                    "Selamat datang kembali, " +
                    user +
                    ". Anda berhasil masuk."
                );


            },
            1300
        );

    }
);


/* =========================================================
   SHOW POPUP
========================================================= */

function showPopup(
    type,
    title,
    message
) {


    /* RESET CLASS */

    popup.classList.remove(
        "success",
        "error"
    );


    popup.classList.add(
        type
    );


    /* TEXT */

    popupTitle.innerText =
        title;

    popupMessage.innerText =
        message;


    /* ICON */

    if (type === "success") {

        popupIcon.innerHTML =

            `
            <div class="checkmark"></div>
            `;

    } else {

        popupIcon.innerHTML =

            `
            <svg
                width="34"
                height="34"
                viewBox="0 0 24 24"
                fill="none">

                <path
                    d="M6 6L18 18"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"/>

                <path
                    d="M18 6L6 18"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"/>

            </svg>
            `;

    }


    /* SHOW */

    popupOverlay.classList.add(
        "active"
    );

}


/* =========================================================
   CLOSE POPUP
========================================================= */

function closePopup() {

    popupOverlay.classList.remove(
        "active"
    );

}


/* =========================================================
   CLOSE BUTTON
========================================================= */

popupClose.addEventListener(
    "click",
    closePopup
);


/* =========================================================
   CLICK OUTSIDE
========================================================= */

popupOverlay.addEventListener(
    "click",
    function (event) {

        if (
            event.target ===
            popupOverlay
        ) {

            closePopup();

        }

    }
);


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key ===
            "Escape"
        ) {

            closePopup();

        }

    }
);


/* =========================================================
   FORGOT PASSWORD
========================================================= */

document
    .getElementById(
        "forgotPassword"
    )
    .addEventListener(
        "click",
        function () {

            showPopup(
                "success",
                "Reset Password",
                "Fitur reset password akan diproses melalui sistem."
            );

        }
    );


/* =========================================================
   PREVENT ACCIDENTAL SUBMIT
========================================================= */

password.addEventListener(
    "keypress",
    function (event) {

        if (
            event.key === "Enter"
        ) {

            loginForm.requestSubmit();

        }

    }
);

</script>

</body>
</html>
